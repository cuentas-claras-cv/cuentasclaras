<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CuentaClara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="authView" class="auth-wrap d-none">
    <div class="card shadow-sm auth-card">
      <div class="card-body p-4">
        <h1 class="h4 mb-1 brand">CuentaClara</h1>
        <p class="text-muted small mb-4">Sube los statements, responde unas preguntas y obtén el reporte para el CPA.</p>
        <form id="loginForm">
          <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Correo" required autocomplete="email">
          <input type="password" id="loginPass" class="form-control mb-3" placeholder="Contraseña" required autocomplete="current-password">
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
          <div id="authMsg" class="small mt-2 text-danger"></div>
        </form>
      </div>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="appView" class="app d-none">
    <nav class="topbar">
      <span class="brand">CuentaClara</span>
      <select id="clientSelect" class="form-select form-select-sm client-select" aria-label="Cliente"></select>
      <button id="newClientBtn" class="btn btn-sm btn-outline-primary">+ Cliente</button>
      <span id="clientForm" class="badge text-bg-light border"></span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <span id="userEmail" class="small text-muted d-none d-md-inline"></span>
        <button id="logoutBtn" class="btn btn-sm btn-link">Salir</button>
      </div>
    </nav>

    <ul class="nav nav-tabs px-2" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabChat" type="button">Chat <span id="pendBadge" class="badge rounded-pill text-bg-warning d-none"></span></button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabTxns" type="button">Transacciones</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabReport" type="button">Reporte</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabSettings" type="button">Ajustes</button></li>
    </ul>

    <div class="tab-content main">
      <!-- Chat -->
      <section id="tabChat" class="tab-pane fade show active chat-pane">
        <div id="messages" class="messages"></div>
        <div id="busy" class="busy d-none"><span class="spinner-border spinner-border-sm"></span> Trabajando…</div>
        <div class="composer">
          <input type="file" id="fileInput" accept=".pdf,.csv,application/pdf,text/csv" multiple hidden>
          <button id="attachBtn" class="btn btn-outline-secondary" title="Subir statements (PDF o CSV)">📎</button>
          <textarea id="chatInput" class="form-control" rows="1" placeholder="Responde o pregunta algo…"></textarea>
          <button id="sendBtn" class="btn btn-primary">Enviar</button>
        </div>
      </section>

      <!-- Transacciones -->
      <section id="tabTxns" class="tab-pane fade p-3">
        <div class="d-flex gap-2 mb-2 flex-wrap">
          <select id="txnFilter" class="form-select form-select-sm w-auto">
            <option value="all">Todas</option>
            <option value="pending">Pendientes</option>
            <option value="auto">Automáticas (revisar)</option>
            <option value="confirmed">Confirmadas</option>
          </select>
          <input id="txnSearch" class="form-control form-control-sm flex-grow-1" style="max-width:320px" placeholder="Buscar descripción…">
          <span id="txnCount" class="small text-muted align-self-center"></span>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle txn-table">
            <thead><tr><th>Fecha</th><th>Descripción</th><th class="text-end">Monto</th><th>Categoría</th><th>Estado</th></tr></thead>
            <tbody id="txnBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Reporte -->
      <section id="tabReport" class="tab-pane fade p-3">
        <div class="d-flex gap-2 mb-3 no-print">
          <button id="xlsxBtn" class="btn btn-success btn-sm">Descargar Excel</button>
          <button id="printBtn" class="btn btn-outline-secondary btn-sm">Imprimir / PDF</button>
        </div>
        <div id="reportView" class="report"></div>
      </section>

      <!-- Ajustes -->
      <section id="tabSettings" class="tab-pane fade p-3">
        <div id="settingsView" style="max-width:820px"></div>
      </section>
    </div>
  </div>

  <!-- ===================== MODAL NUEVO CLIENTE ===================== -->
  <div class="modal fade" id="clientModal" tabindex="-1">
    <div class="modal-dialog">
      <form class="modal-content" id="clientNewForm">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label small mb-1">Nombre del negocio</label>
          <input name="name" class="form-control mb-3" required>
          <label class="form-label small mb-1">¿A qué se dedica? (ayuda a la IA a categorizar)</label>
          <input name="business_desc" class="form-control mb-3" placeholder="Ej: transporte de carga flatbed con 2 camiones">
          <label class="form-label small mb-1">Formulario de impuestos</label>
          <select name="tax_form" class="form-select mb-3"></select>
          <label class="form-label small mb-1">Año fiscal</label>
          <input name="tax_year" type="number" class="form-control" min="2000" max="2100">
        </div>
        <div class="modal-footer"><button class="btn btn-primary" type="submit">Crear cliente</button></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
